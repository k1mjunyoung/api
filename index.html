<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Kim Jun Young — API Response</title>
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);

        --bg: #ffffff;
        --panel-bg: #ffffff;
        --text: #202124;
        --muted: #5f6368;
        --border: #dfe1e5;
        --tabstrip-bg: #dee1e6;
        --toolbar-bg: #f1f3f4;
        --pill-bg: #ffffff;
        --pill-border: #dfe1e5;
        --hover-bg: rgba(32, 33, 36, 0.05);
        --active-bg: #eef0f2;

        --key-color: #9b2393;
        --string-color: #c0341d;
        --number-color: #1a53ff;
        --boolean-color: #1a53ff;
        --null-color: #6b6b6b;
        --punct-color: #202124;
        --link-color: #1a73e8;

        --status-bg: #e6f4ea;
        --status-text: #137333;
        --status-border: #ceead6;
        --method-bg: #ffffff;
        --method-text: #1a73e8;
        --method-border: #1a73e8;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #202124;
          --panel-bg: #202124;
          --text: #e8eaed;
          --muted: #9aa0a6;
          --border: #3c4043;
          --tabstrip-bg: #171717;
          --toolbar-bg: #292a2d;
          --pill-bg: #202124;
          --pill-border: #3c4043;
          --hover-bg: rgba(255, 255, 255, 0.06);
          --active-bg: #303134;

          --key-color: #e3a2d8;
          --string-color: #ff8a6b;
          --number-color: #7aa2ff;
          --boolean-color: #7aa2ff;
          --null-color: #9aa0a6;
          --punct-color: #e8eaed;
          --link-color: #8ab4f8;

          --status-bg: #12281d;
          --status-text: #81c995;
          --status-border: #2a4a37;
          --method-bg: #202124;
          --method-text: #8ab4f8;
          --method-border: #8ab4f8;
        }
      }
      :root[data-theme="dark"] {
        --bg: #202124;
        --panel-bg: #202124;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --border: #3c4043;
        --tabstrip-bg: #171717;
        --toolbar-bg: #292a2d;
        --pill-bg: #202124;
        --pill-border: #3c4043;
        --hover-bg: rgba(255, 255, 255, 0.06);
        --active-bg: #303134;

        --key-color: #e3a2d8;
        --string-color: #ff8a6b;
        --number-color: #7aa2ff;
        --boolean-color: #7aa2ff;
        --null-color: #9aa0a6;
        --punct-color: #e8eaed;
        --link-color: #8ab4f8;

        --status-bg: #12281d;
        --status-text: #81c995;
        --status-border: #2a4a37;
        --method-bg: #202124;
        --method-text: #8ab4f8;
        --method-border: #8ab4f8;
      }

      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }

      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        min-height: 100vh;
      }

      /* ---- fake browser chrome ---- */
      .tabstrip {
        background: var(--tabstrip-bg);
        display: flex;
        align-items: flex-end;
        padding: 8px 8px 0;
        gap: 2px;
      }
      .tab {
        background: var(--panel-bg);
        color: var(--muted);
        border-radius: 8px 8px 0 0;
        padding: 7px 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        max-width: 220px;
        min-width: 0;
      }
      .tab .favicon {
        flex: none;
        font-size: 13px;
        line-height: 1;
      }
      .tab .tab-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tab .tab-close {
        margin-left: auto;
        flex: none;
        opacity: 0.55;
        font-size: 13px;
      }

      .toolbar {
        background: var(--panel-bg);
        padding: 8px 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid var(--border);
      }
      .nav-icon {
        flex: none;
        width: 15px;
        height: 15px;
        color: var(--muted);
        opacity: 0.55;
      }
      .addr-bar {
        flex: 1 1 auto;
        min-width: 0;
        background: var(--toolbar-bg);
        border-radius: 16px;
        padding: 6px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      .addr-bar svg {
        flex: none;
        width: 13px;
        height: 13px;
        color: var(--muted);
      }
      .addr-bar .url {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text);
      }
      .addr-bar .url .scheme {
        color: var(--muted);
      }

      /* ---- response meta bar ---- */
      .response-bar {
        background: var(--toolbar-bg);
        border-bottom: 1px solid var(--border);
        padding: 9px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        font-family:
          ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono",
          Menlo, monospace;
        font-size: 12px;
      }
      .pill {
        padding: 2px 9px;
        border-radius: 4px;
        border: 1px solid var(--pill-border);
        background: var(--pill-bg);
        white-space: nowrap;
      }
      .pill.method {
        color: var(--method-text);
        border-color: var(--method-border);
        font-weight: 600;
      }
      .pill.status {
        color: var(--status-text);
        background: var(--status-bg);
        border-color: var(--status-border);
        font-weight: 600;
      }
      .meta-muted {
        color: var(--muted);
        white-space: nowrap;
      }
      .spacer-flex {
        flex: 1 1 auto;
      }
      .view-toggle {
        display: flex;
        border: 1px solid var(--pill-border);
        border-radius: 4px;
        overflow: hidden;
        flex: none;
      }
      .view-toggle button {
        font: inherit;
        color: var(--muted);
        background: var(--pill-bg);
        border: none;
        padding: 3px 10px;
        cursor: pointer;
      }
      .view-toggle button + button {
        border-left: 1px solid var(--pill-border);
      }
      .view-toggle button.active {
        background: var(--active-bg);
        color: var(--text);
        font-weight: 600;
      }
      .icon-btn {
        flex: none;
        border: 1px solid var(--pill-border);
        background: var(--pill-bg);
        color: var(--muted);
        border-radius: 4px;
        padding: 3px 9px;
        font: inherit;
        cursor: pointer;
      }
      .icon-btn:hover,
      .view-toggle button:hover {
        background: var(--hover-bg);
      }
      .icon-btn.copied {
        color: var(--status-text);
        border-color: var(--status-border);
      }

      /* ---- json body ---- */
      .json-panel {
        background: var(--panel-bg);
        padding: 18px 16px 40px;
        overflow-x: auto;
      }
      .json-body,
      .raw-body {
        font-family:
          ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono",
          Menlo, monospace;
        font-size: 13px;
        line-height: 1.65;
      }
      .raw-body {
        display: none;
      }
      .raw-body pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--text);
      }
      body.raw-mode .json-body {
        display: none;
      }
      body.raw-mode .raw-body {
        display: block;
      }

      .line {
        display: flex;
        align-items: flex-start;
        padding: 1px 4px;
        border-radius: 3px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .line:hover {
        background: var(--hover-bg);
      }

      .toggle,
      .spacer {
        flex: none;
        width: 1rem;
        text-align: center;
        user-select: none;
      }
      .toggle {
        color: var(--muted);
        cursor: pointer;
        font-size: 10px;
        padding-top: 3px;
      }
      .toggle::before {
        content: "▾";
      }
      .node.collapsed > .line > .toggle::before {
        content: "▸";
      }

      .key {
        color: var(--key-color);
      }
      .string {
        color: var(--string-color);
      }
      .number {
        color: var(--number-color);
      }
      .boolean {
        color: var(--boolean-color);
      }
      .null {
        color: var(--null-color);
      }
      .punct {
        color: var(--punct-color);
      }
      .link {
        color: var(--link-color);
        text-decoration: underline;
      }
      .link:hover {
        text-decoration: none;
      }

      .summary {
        display: none;
        color: var(--muted);
      }
      .close-inline {
        display: none;
      }
      .node.collapsed > .children,
      .node.collapsed > .close-line {
        display: none;
      }
      .node.collapsed > .line .summary,
      .node.collapsed > .line .close-inline {
        display: inline;
      }

      .note {
        font-family:
          ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono",
          Menlo, monospace;
        font-size: 12px;
        color: var(--muted);
        font-style: italic;
        padding: 0 16px 28px;
        background: var(--panel-bg);
      }

      @media (max-width: 480px) {
        .tab {
          max-width: 150px;
        }
        .response-bar {
          font-size: 11px;
        }
        .json-body,
        .raw-body {
          font-size: 12.5px;
        }
      }
    </style>
  </head>
  <body>
    <div class="tabstrip">
      <div class="tab">
        <span class="favicon">🖥️</span>
        <span class="tab-title">profile.json</span>
        <span class="tab-close">✕</span>
      </div>
    </div>

    <div class="toolbar">
      <svg
        class="nav-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M15 6l-6 6 6 6" />
      </svg>
      <svg
        class="nav-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M9 6l6 6-6 6" />
      </svg>
      <svg
        class="nav-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          d="M4 4v5h5M20 20v-5h-5M4.5 9a8 8 0 0114.5-3M19.5 15a8 8 0 01-14.5 3"
        />
      </svg>
      <div class="addr-bar">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="5" y="11" width="14" height="9" rx="1.5" />
          <path d="M8 11V7a4 4 0 018 0v4" />
        </svg>
        <span class="url"
          ><span class="scheme">https://</span
          >api.kimjunyoung.com/v1/profile</span
        >
      </div>
    </div>

    <div class="response-bar">
      <span class="pill method">GET</span>
      <span class="pill status">200 OK</span>
      <span class="meta-muted">content-type: application/json</span>
      <span class="spacer-flex"></span>
      <div class="view-toggle">
        <button type="button" id="btn-parsed" class="active">Parsed</button>
        <button type="button" id="btn-raw">Raw</button>
      </div>
      <button type="button" class="icon-btn" id="btn-copy">Copy</button>
    </div>

    <div class="json-panel">
      <div class="json-body" id="json-root"></div>
      <div class="raw-body"><pre id="raw-text"></pre></div>
    </div>

    <p class="note">// Copyright 2026. kimjunyoung.com.</p>

    <script>
      (function () {
        var data = {
          name: "Kim Jun Young",
          role: "Backend engineer",
          location: "Seoul",
          education:
            "Bachelor of Science in Information Security Engineering, SCH University",
          club: "LikeLion 11th",
          email: "me@kimjunyoung.com",
          homepage: "https://kimjunyoung.com",
          // blog: "https://tech.kimjunyoung.com",
          career: [
            {
              company: "UST21",
              date: "2024-08~2026-09",
              role: "Backend engineer",
            },
            {
              company: "Bluecore",
              date: "2024-01~2024-07",
              role: "Backend engineer",
            },
            {
              company: "Bluecore",
              date: "2023-06~2023-12",
              role: "Intern",
            },
          ],
          projects: [
            {
              name: "환경위성",
            },
          ],
          skills: ["java", "spring", "jpa", "git", "aws", "docker"],
          interested_in: [
            "Effective-Java",
            "Spring-Core",
            "Redis",
            "NoSQL",
            "TDD",
            "Algorithm",
          ],
        };

        function el(tag, className, text) {
          var e = document.createElement(tag);
          if (className) e.className = className;
          if (text !== undefined) e.textContent = text;
          return e;
        }

        function countLabel(value) {
          if (Array.isArray(value)) {
            return value.length + (value.length === 1 ? " item" : " items");
          }
          var n = Object.keys(value).length;
          return n + (n === 1 ? " key" : " keys");
        }

        function renderPrimitive(value) {
          var span = el("span");
          if (typeof value === "string") {
            span.className = "string";
            if (/^https?:\/\//.test(value)) {
              span.appendChild(document.createTextNode('"'));
              var a = document.createElement("a");
              a.href = value;
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              a.className = "link";
              a.textContent = value;
              span.appendChild(a);
              span.appendChild(document.createTextNode('"'));
            } else {
              span.textContent = JSON.stringify(value);
            }
          } else if (typeof value === "number") {
            span.className = "number";
            span.textContent = String(value);
          } else if (typeof value === "boolean") {
            span.className = "boolean";
            span.textContent = String(value);
          } else {
            span.className = "null";
            span.textContent = "null";
          }
          return span;
        }

        function makeLine(depth) {
          var line = el("div", "line");
          line.style.paddingLeft = depth * 1.1 + "rem";
          return line;
        }

        function renderNode(parent, value, key, isLast, depth) {
          var isContainer = value !== null && typeof value === "object";

          if (!isContainer) {
            var line = makeLine(depth);
            line.appendChild(el("span", "spacer"));
            if (key !== null) {
              line.appendChild(el("span", "key", '"' + key + '"'));
              line.appendChild(el("span", "punct", ": "));
            }
            line.appendChild(renderPrimitive(value));
            line.appendChild(el("span", "punct", isLast ? "" : ","));
            parent.appendChild(line);
            return;
          }

          var isArray = Array.isArray(value);
          var node = el("div", "node");

          var header = makeLine(depth);
          var toggle = el("span", "toggle");
          header.appendChild(toggle);
          if (key !== null) {
            header.appendChild(el("span", "key", '"' + key + '"'));
            header.appendChild(el("span", "punct", ": "));
          }
          header.appendChild(el("span", "punct", isArray ? "[" : "{"));
          header.appendChild(
            el("span", "summary", " " + countLabel(value) + " "),
          );
          header.appendChild(
            el(
              "span",
              "punct close-inline",
              (isArray ? "]" : "}") + (isLast ? "" : ","),
            ),
          );
          node.appendChild(header);

          var children = el("div", "children");
          var entries = isArray
            ? value.map(function (v, i) {
                return [null, v];
              })
            : Object.keys(value).map(function (k) {
                return [k, value[k]];
              });
          entries.forEach(function (pair, idx) {
            renderNode(
              children,
              pair[1],
              pair[0],
              idx === entries.length - 1,
              depth + 1,
            );
          });
          node.appendChild(children);

          var closeLine = makeLine(depth);
          closeLine.className += " close-line";
          closeLine.appendChild(el("span", "spacer"));
          closeLine.appendChild(
            el("span", "punct", (isArray ? "]" : "}") + (isLast ? "" : ",")),
          );
          node.appendChild(closeLine);

          toggle.addEventListener("click", function () {
            node.classList.toggle("collapsed");
          });

          parent.appendChild(node);
        }

        renderNode(document.getElementById("json-root"), data, null, true, 0);
        document.getElementById("raw-text").textContent = JSON.stringify(
          data,
          null,
          2,
        );

        document
          .getElementById("btn-parsed")
          .addEventListener("click", function () {
            document.body.classList.remove("raw-mode");
            this.classList.add("active");
            document.getElementById("btn-raw").classList.remove("active");
          });
        document
          .getElementById("btn-raw")
          .addEventListener("click", function () {
            document.body.classList.add("raw-mode");
            this.classList.add("active");
            document.getElementById("btn-parsed").classList.remove("active");
          });

        document
          .getElementById("btn-copy")
          .addEventListener("click", function () {
            var text = JSON.stringify(data, null, 2);
            var btn = this;
            function done() {
              var original = "Copy";
              btn.textContent = "Copied";
              btn.classList.add("copied");
              setTimeout(function () {
                btn.textContent = original;
                btn.classList.remove("copied");
              }, 1200);
            }
            try {
              navigator.clipboard.writeText(text).then(done, function () {
                fallbackCopy(text, done);
              });
            } catch (e) {
              fallbackCopy(text, done);
            }
            function fallbackCopy(t, cb) {
              try {
                var ta = document.createElement("textarea");
                ta.value = t;
                ta.style.position = "fixed";
                ta.style.opacity = "0";
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
                cb();
              } catch (e2) {}
            }
          });
      })();
    </script>
  </body>
</html>
